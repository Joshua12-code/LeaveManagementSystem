<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Employee Leave Analytics</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
}

/* Navbar */

.navbar{
    background:#2c3e50;
    color:white;
    padding:18px;
    text-align:center;
    font-size:22px;
}

/* Container */

.container{
    max-width:1200px;
    margin:auto;
    padding:30px;
}

/* SUMMARY CARDS */

.summary-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin-bottom:35px;
}

.summary-card{
    background:white;
    padding:18px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 3px 8px rgba(0,0,0,0.08);
}

.summary-card h4{
    margin-bottom:8px;
    color:#555;
}

.summary-card p{
    font-size:24px;
    font-weight:bold;
}

/* CHART GRID */

.chart-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}

/* Chart cards */

.chart-card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 3px 8px rgba(0,0,0,0.08);
}

.chart-card h3{
    margin-bottom:15px;
    font-size:18px;
    text-align:center;
}

/* Chart container */

.chart-container{
    position:relative;
    height:320px;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
}

canvas{
    max-width:100%;
}

/* Monthly chart bigger */

.monthly-chart{
    height:360px;
}

/* Full width section */

.full-chart{
    margin-top:25px;
}

/* Button */

button{
    margin-top:35px;
    padding:10px 20px;
    background:#2c3e50;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#34495e;
}

/* Hover effect */

.chart-card:hover,
.summary-card:hover{
    transform:translateY(-3px);
    transition:0.2s;
}

</style>
</head>

<body>

<div class="navbar">
Employee Leave Analytics Dashboard
</div>

<div class="container">

<!-- SUMMARY -->

<div class="summary-grid">

<div class="summary-card">
<h4>Total Leave</h4>
<p id="totalLeave">Loading...</p>
</div>

<div class="summary-card">
<h4>Taken Leave</h4>
<p id="takenLeave">Loading...</p>
</div>

<div class="summary-card">
<h4>Remaining Leave</h4>
<p id="remainingLeave">Loading...</p>
</div>

<div class="summary-card">
<h4>Pending Leave</h4>
<p id="pendingLeave">Loading...</p>
</div>

</div>

<!-- CHARTS -->

<div class="chart-grid">

<div class="chart-card">

<h3>Leave Usage</h3>

<div class="chart-container">
<canvas id="leaveChart"></canvas>
</div>

</div>

<div class="chart-card">

<h3>Leave Type Distribution</h3>

<div class="chart-container">
<canvas id="leaveTypeChart"></canvas>
</div>

</div>

</div>

<!-- MONTHLY TREND -->

<div class="chart-card full-chart">

<h3>Monthly Leave Trend</h3>

<div class="chart-container monthly-chart">
<canvas id="monthlyLeaveChart"></canvas>
</div>

</div>

<button onclick="goBack()">⬅ Back to Dashboard</button>

</div>

<script src="js/employee-analytics.js"></script>

<script>
function goBack(){
    window.location.href="employee-dashboard.html";
}
</script>

</body>
</html>
